<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eOrth 부스 뽑기</title>
<style>
  :root{
    --bg:#0A0A0F;
    --ink:#F5F3FA;
    --dim:#A1A1B0;
    --line:#1A1A26;
    --card:#2E2E3B;
    --neon:#BF85FC;
    --deep:#6B21A8;
    --red:#FF3B30;
    --ticket:#17141F;
    --ticket-2:#100E18;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  }

  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #191129 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .page{max-width:1080px;margin:0 auto;padding:48px 20px 96px;display:flex;flex-direction:column;gap:64px}

  h2{font-size:20px;margin:0;letter-spacing:-.01em}
  .sec{display:flex;flex-direction:column;gap:20px}

  /* ── 데모 무대 ── */
  .stage{
    position:relative;background:linear-gradient(180deg,#100C1A,#0A0A0F);
    border:1px solid var(--line);border-radius:20px;
    min-height:520px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .stars{position:absolute;inset:0;pointer-events:none;opacity:.5}
  /* ── 발권기 ── */
  .kiosk{position:relative;width:min(100%,420px);display:flex;flex-direction:column}

  .face{
    position:relative;z-index:3;
    background:linear-gradient(180deg,#221E30 0%,#15121D 62%,#0F0D16 100%);
    border:1px solid #26222F;border-radius:16px 16px 7px 7px;
    padding:14px 16px 0;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 20px 44px -26px #000, inset 0 1px 0 rgba(255,255,255,.06);
  }
  /* 급지 중 기계 진동. 부드럽게 흔들면 살아 있는 것처럼 보이므로 steps로 딱딱 끊는다 */
  .face.busy{animation:hum .085s steps(4,end) infinite}
  @keyframes hum{
    0%{transform:translate(0,0)}
    25%{transform:translate(.4px,-.3px)}
    50%{transform:translate(-.35px,.3px)}
    75%{transform:translate(.25px,.25px)}
    100%{transform:translate(0,0)}
  }

  .face-top{display:flex;align-items:center;gap:9px}
  .led{
    width:7px;height:7px;border-radius:50%;background:#3A3644;flex:none;
    transition:background .25s,box-shadow .25s
  }
  .face.busy .led{background:#FFB25C;box-shadow:0 0 9px #FFB25C;animation:blink .42s steps(1,end) infinite}
  .face.done .led{background:var(--neon);box-shadow:0 0 9px var(--neon)}
  @keyframes blink{0%,58%{opacity:1}59%,100%{opacity:.22}}
  .face-label{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
    cursor:default;user-select:none;-webkit-user-select:none
  }

  .start{
    background:var(--neon);color:#0A0A0F;border:0;border-radius:11px;
    padding:14px;font-size:16px;font-weight:800;font-family:var(--sans);cursor:pointer;
    transition:transform .1s ease, box-shadow .2s ease, opacity .2s;
  }
  .start:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 26px -14px rgba(191,133,252,.9)}
  .start:active:not(:disabled){transform:translateY(1px)}
  .start:disabled{opacity:.45;cursor:default}
  .start:focus-visible{outline:3px solid #fff;outline-offset:3px}

  /* 슬롯은 기계의 아래 모서리 그 자체다. 안쪽에 여백을 두고 놓으면
     용지가 슬롯이 아니라 기계 밑동에서 삐져나오는 것으로 보인다. */
  .slot{
    position:relative;height:13px;margin:0 -16px;border-radius:0 0 6px 6px;
    background:linear-gradient(180deg,#000 0%,#07060C 100%);
    box-shadow:inset 0 3px 8px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.06)
  }
  .slot-glow{
    position:absolute;left:12px;right:12px;bottom:1px;height:2px;border-radius:2px;
    background:var(--neon);opacity:0;filter:blur(1.5px);transition:opacity .25s
  }
  .face.busy .slot-glow{opacity:.95}

  /* 배출구 — 좌우·아래 여백은 그림자가 잘리지 않도록 두고, 위쪽만 슬롯에 물려 잘린다 */
  .exit{
    position:relative;overflow:hidden;
    padding:0 26px 44px;margin:-4px -26px -44px
  }
  .exit::before{
    content:"";position:absolute;top:0;left:0;right:0;height:30px;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.36) 55%,transparent 100%)
  }
  /* 감열 프린터는 롤러가 한 칸씩 돈다 — steps로 끊어야 종이가 밀려 나오는 것으로 읽힌다 */
  .feed{transform:translateY(-103%)}
  .feed.out{animation:feed 1s steps(20,end) forwards}
  @keyframes feed{from{transform:translateY(-103%)}to{transform:translateY(0)}}

  /* ── 보딩패스 ── */
  .pass{
    --stripe:var(--dim);
    position:relative;background:linear-gradient(155deg,var(--ticket) 0%,var(--ticket-2) 100%);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    display:grid;grid-template-columns:1fr 104px;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
  }
  .pass::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stripe);
  }
  .pass.gold::before{
    background:linear-gradient(180deg,#BF85FC 0%,#FFD9A0 45%,#7EE7E0 100%);
  }
  .pass.gold{border-color:rgba(255,217,160,.28)}
  .pass.void{filter:saturate(.25);opacity:.86}

  .main{padding:20px 20px 16px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}

  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .wordmark{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;font-size:15px}
  .orb{width:16px;height:16px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 32% 30%, #E6CBFF, var(--neon) 42%, var(--deep) 100%);
    box-shadow:0 0 10px rgba(191,133,252,.6)}
  .class{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--stripe);border:1px solid currentColor;border-radius:999px;padding:3px 9px;white-space:nowrap;
  }
  .pass.gold .class{color:#FFD9A0;border-color:rgba(255,217,160,.55)}

  .route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
  .iata{font-family:var(--mono);font-size:36px;font-weight:700;letter-spacing:.02em;line-height:1}
  .city{font-size:11.5px;color:var(--dim);margin-top:5px;letter-spacing:.02em}
  .to{text-align:right}
  .arc{position:relative;height:22px;color:var(--dim);opacity:.75}
  .arc svg{width:100%;height:100%;display:block}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin:0}
  .f{display:flex;flex-direction:column;gap:3px;min-width:0}
  .f dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
  .f dd{margin:0;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.02em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .prize{
    border-top:1px dashed rgba(161,161,176,.25);padding-top:13px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px
  }
  .prize .label{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
  .prize .val{font-size:15px;font-weight:700;text-align:right}
  .pass.gold .prize .val{color:#FFD9A0}
  .pass.void .prize .val{color:var(--dim);font-weight:600}

  /* 스텁 */
  .stub{
    position:relative;border-left:2px dashed rgba(161,161,176,.28);
    padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;
    background:rgba(0,0,0,.22)
  }
  .stub::before,.stub::after{
    content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)
  }
  .stub::before{top:-9px}
  .stub::after{bottom:-9px}
  .rank{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;color:var(--stripe)}
  .pass.gold .rank{color:#FFD9A0}
  .rank small{font-size:13px;font-weight:600;margin-left:1px}
  .cap{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-align:center}
  .barcode{width:100%;height:44px;
    background:repeating-linear-gradient(90deg,
      var(--ink) 0 1px, transparent 1px 3px,
      var(--ink) 3px 5px, transparent 5px 6px,
      var(--ink) 6px 7px, transparent 7px 10px);
    opacity:.72}

  .seal{
    position:absolute;right:118px;bottom:16px;transform:rotate(-11deg);
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;
    border:1.5px solid currentColor;border-radius:4px;padding:4px 8px;pointer-events:none;display:none
  }
  .pass.gold .seal.real{display:block;color:#FFD9A0;opacity:.9}
  .pass.void .seal.void{display:block;color:var(--dim);opacity:.75}

  .hidden{display:none}

  /* ── 날짜 선택 / 발권기 래퍼 ── */
  .setup{align-items:center;text-align:center;padding-top:48px}
  .setup h2{font-size:22px}
  .setup-note{color:var(--dim);font-size:14px;max-width:36ch;margin:0}
  .day-picks{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,420px);margin-top:8px}
  .day{
    display:flex;flex-direction:column;gap:6px;padding:22px 14px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;
    font-family:var(--sans);transition:border-color .15s,transform .1s
  }
  .day:hover{border-color:var(--neon)}
  .day:active{transform:translateY(1px)}
  .day:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
  .day-name{font-size:18px;font-weight:800}
  .day-sub{font-size:12px;color:var(--dim);font-family:var(--mono);letter-spacing:.03em}
  .kiosk-wrap{align-items:center}
  .done-note{color:var(--dim);font-size:14px;text-align:center;margin:0}

  @media (max-width:520px){
    .iata{font-size:30px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .seal{right:112px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }

  /* ── 관리 패널 ── */
  .admin{
    width:min(100%,420px);background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px
  }
  .admin-head{display:flex;align-items:center;justify-content:space-between}
  .admin-head h3{margin:0;font-size:16px}
  .x{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:4px 8px}
  .x:hover{color:var(--ink)}
  .admin-table{width:100%;border-collapse:collapse;font-size:14px}
  .admin-table th{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);text-align:left;font-weight:500;padding-bottom:6px
  }
  .admin-table td{padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .admin-table td:nth-child(2),.admin-table td:nth-child(3){width:76px}
  .admin-table input{
    width:64px;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:14px
  }
  .admin-table input:focus-visible{outline:2px solid var(--neon);outline-offset:1px}
  .admin-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ghost{
    background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:11px;font-size:13px;font-family:var(--sans);cursor:pointer
  }
  .ghost:hover{border-color:var(--neon);color:var(--neon)}
  .ghost:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
  .ghost.danger:hover{border-color:var(--red);color:var(--red)}
  .admin-msg{margin:0;font-size:13px;color:var(--neon);min-height:18px}

  /* ── 스태프 경고 ──
     발권 실패·다른 탭 충돌·저장소 오류처럼 "재고가 틀어질 수 있는" 사건만 여기에 띄운다.
     관리 패널 토스트(3초)와 달리 저절로 사라지지 않는다 — 부스 소음 속에서 3초는 없는 것과 같다. */
  .alert{
    margin:0;background:var(--card);border:1px solid var(--neon);border-left:4px solid var(--neon);
    border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5;cursor:pointer
  }
</style>
</head>
<body>

<div class="page">

  <!-- 스태프 경고 — 눌러야 닫힌다. 날짜 선택 화면에서도 보여야 해서 page 맨 위에 둔다 -->
  <p class="alert hidden" id="alert" role="alert"></p>

  <!-- 날짜 선택 — 저장된 상태가 없을 때만 뜬다 -->
  <section class="sec setup" id="setup">
    <h2>오늘은 며칠째인가요?</h2>
    <p class="setup-note">한 번 고르면 이 기기의 재고가 그날 것으로 정해집니다.
      바꾸려면 관리 패널에서 초기화해야 합니다.</p>
    <div class="day-picks">
      <!-- 문구는 렌더 시점에 DAY_POOLS·EVENT_DAYS에서 만든다(아래 스크립트).
           수량을 여기 적어두면 꽝 수량이 정해지는 순간 화면만 거짓말을 한다. -->
      <button class="day" data-day="D1">
        <span class="day-name"></span>
        <span class="day-sub"></span>
      </button>
      <button class="day" data-day="D2">
        <span class="day-name"></span>
        <span class="day-sub"></span>
      </button>
    </div>
  </section>

  <!-- 발권기 -->
  <section class="sec kiosk-wrap hidden" id="kioskWrap">
    <div class="stage" id="stage">
      <canvas class="stars" id="stars"></canvas>
      <div class="kiosk">
        <div class="face" id="face">
          <div class="face-top">
            <span class="led"></span>
            <span class="face-label" id="faceLabel">eOrth Boarding Pass</span>
          </div>
          <button class="start" id="start">시작하기</button>
          <div class="slot"><i class="slot-glow"></i></div>
        </div>
        <div class="exit">
          <div class="feed" id="feed"><div id="passSlot"></div></div>
        </div>
      </div>
    </div>
    <p class="done-note hidden" id="doneNote">오늘 발권이 모두 끝났습니다.</p>

    <div class="admin hidden" id="admin">
      <div class="admin-head">
        <h3>관리</h3>
        <button class="x" id="adminClose" aria-label="닫기">✕</button>
      </div>

      <table class="admin-table">
        <thead><tr><th>등급</th><th>남음</th><th>발권</th></tr></thead>
        <tbody id="adminRows"></tbody>
      </table>

      <div class="admin-acts">
        <button class="ghost" id="undo">마지막 1건 되돌리기</button>
        <button class="ghost" id="copyState">상태 복사</button>
        <button class="ghost" id="pasteState">상태 붙여넣기</button>
        <button class="ghost danger" id="resetDay">날짜 다시 고르기</button>
      </div>

      <p class="admin-msg" id="adminMsg"></p>
    </div>
  </section>

</div>

<template id="passTpl">
  <article class="pass">
    <div class="main">
      <div class="brand">
        <span class="wordmark"><i class="orb"></i>eOrth</span>
        <span class="class" data-f="cls"></span>
      </div>

      <div class="route">
        <div>
          <div class="iata">EOR</div>
          <div class="city">이어스</div>
        </div>
        <div class="arc">
          <svg viewBox="0 0 120 22" fill="none" aria-hidden="true">
            <path d="M2 18 C 30 2, 90 2, 118 18" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 5"/>
          </svg>
        </div>
        <div class="to">
          <div class="iata">DKU</div>
          <div class="city">단국대</div>
        </div>
      </div>

      <dl class="grid">
        <div class="f"><dt>Passenger</dt><dd>부스 방문객</dd></div>
        <div class="f"><dt>Flight</dt><dd data-f="flight"></dd></div>
        <div class="f"><dt>Date</dt><dd data-f="date"></dd></div>
        <div class="f"><dt>Gate</dt><dd>B04</dd></div>
        <div class="f"><dt>Seat</dt><dd data-f="seat"></dd></div>
        <div class="f"><dt>Boarding</dt><dd data-f="boarding"></dd></div>
      </dl>

      <div class="prize">
        <span class="label">Baggage</span>
        <span class="val" data-f="prize"></span>
      </div>
    </div>

    <aside class="stub">
      <div class="rank"><span data-f="rankNum"></span><small data-f="rankUnit"></small></div>
      <div class="barcode"></div>
      <div class="cap" data-f="cap"></div>
    </aside>

    <span class="seal real">REAL TICKET</span>
    <span class="seal void">STANDBY</span>
  </article>
</template>

<script type="module">
  import {
    GRADES, GRADE_KEYS, DAY_POOLS, EVENT_DAYS, makePool, drawOne, undoLast, setRemaining,
    remaining, tally, restore, isExhausted,
  } from './draw-core.js';

  const KEY = 'eorth_draw_v1';

  const setup     = document.getElementById('setup');
  const kioskWrap = document.getElementById('kioskWrap');
  const stage     = document.getElementById('stage');
  const stars     = document.getElementById('stars');
  const face      = document.getElementById('face');
  const feed      = document.getElementById('feed');
  const start     = document.getElementById('start');
  const passSlot  = document.getElementById('passSlot');
  const doneNote  = document.getElementById('doneNote');
  const tpl       = document.getElementById('passTpl');
  const alertBox  = document.getElementById('alert');

  /** 스태프에게 남기는 경고. 저절로 사라지지 않고, 눌러야 닫힌다. */
  function warn(msg){
    alertBox.textContent = msg;
    alertBox.classList.remove('hidden');
  }
  alertBox.addEventListener('click', function(){ alertBox.classList.add('hidden'); });

  // localStorage는 iOS 사파리 프라이빗 탭 등에서 '읽는 것 자체'가 예외를 던진다.
  // 막지 않으면 이 모듈이 통째로 실행되지 않아 아무 설명 없는 흰 화면이 된다.
  let state = null;
  try {
    state = restore(localStorage.getItem(KEY));
  } catch (e) {
    warn('이 브라우저에서 저장소를 쓸 수 없습니다(프라이빗 모드일 수 있습니다). ' +
         '발권은 되지만 새로고침하면 재고가 사라집니다 — 일반 탭에서 다시 열어 주세요.');
  }

  function save(){
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  // ── 별 배경 ───────────────────────────────────────────────
  // 시안에서는 페이지 로드 즉시 그렸지만, 이 화면은 날짜 선택 전엔 발권기가
  // 숨어 있어 캔버스 크기가 0이다 — 즉시 실행하면 아무것도 안 그려진다.
  // 그래서 enterKiosk()가 화면을 보여준 뒤에 호출한다.
  function paintStars(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    stars.width = w * dpr; stars.height = h * dpr;
    stars.style.width = w + 'px'; stars.style.height = h + 'px';
    const ctx = stars.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // 시드 고정 난수 — 리사이즈해도 별자리가 갈리지 않는다
    let s = 20260909;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    for (let i = 0; i < 90; i++){
      const x = rnd() * w, y = rnd() * h, r = rnd() * 1.3 + .3;
      ctx.globalAlpha = rnd() * .55 + .15;
      ctx.fillStyle = rnd() > .82 ? '#BF85FC' : '#FFFFFF';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  window.addEventListener('resize', paintStars);

  /**
   * 템플릿을 복제해 등급 하나를 그린다.
   * 이 페이지는 innerHTML을 쓰지 않는다 — 막아주는 훅이나 lint 규칙이 있어서가 아니라
   * (이 저장소에는 없다) 마크업을 문자열로 조립하기 시작하면 나중에 사람이 넣은 값이
   * 섞여 들어가기 때문이다. cloneNode + textContent만 쓴다.
   */
  function renderPass(gradeKey){
    const g = GRADES[gradeKey];
    const day = EVENT_DAYS[state.day];
    const node = tpl.content.firstElementChild.cloneNode(true);

    node.style.setProperty('--stripe', g.stripe);
    if (g.gold) node.classList.add('gold');
    if (g.isVoid) node.classList.add('void');

    const set = (name, text) => { node.querySelector('[data-f="' + name + '"]').textContent = text; };
    set('cls', g.cls);
    set('seat', g.seat);
    set('boarding', g.isVoid ? 'WAIT' : 'NOW');
    set('prize', g.prize);
    set('date', day.date);
    set('flight', day.flight);
    set('rankNum', g.isVoid ? '꽝' : g.rank.replace('등', ''));
    set('rankUnit', g.isVoid ? '' : '등');
    set('cap', day.flight.replace(' ', '') + ' · ' + g.seat);

    passSlot.replaceChildren(node);
  }

  /** 재고가 바닥나면 버튼을 잠근다 — 조용히 꽝을 주지 않는다 */
  function refreshKiosk(){
    const dry = isExhausted(state);
    start.disabled = dry;
    doneNote.classList.toggle('hidden', !dry);
    // 라벨도 매번 현재 상태에서 다시 정한다. 한 번 '발권 종료'로 바꾸고 되돌리지 않으면,
    // 관리 패널로 재고를 채우거나 되돌리기를 해도 버튼에 '발권 종료'가 남아 스태프가 안 누른다.
    start.textContent = dry ? '발권 종료' : (state.history.length ? '다시 뽑기' : '시작하기');
  }

  function run(){
    if (isExhausted(state)) return;
    start.disabled = true;

    // 실패하면 되돌릴 직전 상태. save()는 정족량 초과·프라이빗 모드에서 던질 수 있고,
    // renderPass도 표가 어긋나면 던진다.
    const prev = state;
    let result;
    try {
      result = drawOne(state);
      state = result.state;
      save();                                // 애니메이션 전에 저장한다 — 도중에 앱이 꺼져도 재고가 맞는다
      renderPass(result.grade);
      syncAdminNumbers();                    // 패널을 열어둔 채 발권해도 숫자가 박제되지 않게
    } catch (e) {
      // 여기까지 왔다는 건 참가자가 탑승권을 못 봤다는 뜻이다 — 상품이 안 나갔으므로 차감을
      // 되돌린다. 안 되돌리면 실패할 때마다 재고가 한 개씩 조용히 증발한다(스태프는 알 방법이 없다).
      state = prev;
      try { save(); } catch (e2) { /* 저장 자체가 막힌 상황 — 메모리 재고라도 맞춰 둔다 */ }
      passSlot.replaceChildren();
      face.classList.remove('busy');
      refreshKiosk();                        // 버튼을 되살린다 — 안 그러면 새로고침 말고는 복구가 없다
      syncAdminNumbers();
      warn('발권에 실패해 이 1건을 되돌렸습니다(재고는 그대로입니다). 다시 눌러 주세요. — ' +
           (e && e.message ? e.message : String(e)));
      return;
    }

    face.classList.remove('done');
    feed.classList.remove('out');
    void feed.offsetWidth;                   // 리플로우 — 두 번째부터도 애니메이션이 다시 걸리게
    face.classList.add('busy');
    feed.classList.add('out');
  }

  feed.addEventListener('animationend', function(){
    face.classList.remove('busy');
    face.classList.add('done');
    refreshKiosk();   // 버튼 활성화와 라벨('다시 뽑기'/'발권 종료')을 여기서 한 곳으로 모은다
  });

  start.addEventListener('click', run);

  // ── 날짜 선택 ──
  for (const btn of document.querySelectorAll('.day')){
    // 이름과 개수는 표에서 만든다 — 꽝 수량이 정해지면 DAY_POOLS만 고쳐도 버튼이 따라온다.
    // 하드코딩해 두면 "501개"라고 적힌 버튼이 실제로는 531개를 나눠주게 된다.
    const day  = btn.dataset.day;
    const pool = DAY_POOLS[day];
    const sum  = GRADE_KEYS.reduce(function(n, k){ return n + (pool[k] || 0); }, 0);
    btn.querySelector('.day-name').textContent = EVENT_DAYS[day].label;
    btn.querySelector('.day-sub').textContent =
      (pool.g1 > 0 ? '항공권 포함' : '항공권 없음') + ' · ' + sum + '개';

    btn.addEventListener('click', function(){
      state = makePool(btn.dataset.day);
      // 저장이 막혀도 화면은 연다 — 메모리 재고로라도 부스를 돌릴 수 있어야 한다
      try {
        save();
      } catch (e) {
        warn('재고를 저장하지 못했습니다(프라이빗 모드일 수 있습니다). ' +
             '이대로도 발권은 되지만 새로고침하면 오늘 기록이 사라집니다.');
      }
      enterKiosk();
    });
  }

  function enterKiosk(){
    setup.classList.add('hidden');
    kioskWrap.classList.remove('hidden');
    paintStars();
    refreshKiosk();
    keepAwake();
  }

  // ── 화면 꺼짐 방지 ──
  // 부스에서 화면이 꺼지면 스태프가 매번 깨워야 한다. 미지원 브라우저에서는 조용히 넘어간다.
  let wakeLock = null;
  async function keepAwake(){
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch { /* 배터리 절약 모드 등에서 거부될 수 있다 — 기능이 아니라 편의다 */ }
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') keepAwake();
  });

  // ── 관리 패널 ──
  // 라벨을 3초 길게 눌러 연다. 참가자가 실수로 열 수 없어야 하고,
  // 스태프는 안내 없이도 찾을 수 있어야 해서 "누르고 있으면 열리는" 방식을 골랐다.
  const admin     = document.getElementById('admin');
  const adminRows = document.getElementById('adminRows');
  const adminMsg  = document.getElementById('adminMsg');
  const faceLabel = document.getElementById('faceLabel');

  let holdTimer = 0;
  const startHold = () => {
    clearTimeout(holdTimer);
    holdTimer = setTimeout(openAdmin, 3000);
  };
  const cancelHold = () => clearTimeout(holdTimer);

  faceLabel.addEventListener('pointerdown', startHold);
  faceLabel.addEventListener('pointerup', cancelHold);
  faceLabel.addEventListener('pointercancel', cancelHold);
  faceLabel.addEventListener('pointerleave', cancelHold);

  function say(msg){
    adminMsg.textContent = msg;
    setTimeout(function(){ if (adminMsg.textContent === msg) adminMsg.textContent = ''; }, 3000);
  }

  function openAdmin(){
    renderAdmin();
    admin.classList.remove('hidden');
  }

  function renderAdmin(){
    const left = remaining(state);
    const done = tally(state);
    adminRows.replaceChildren();

    for (const k of GRADE_KEYS){
      const tr = document.createElement('tr');

      const name = document.createElement('td');
      name.textContent = GRADES[k].rank + ' · ' + GRADES[k].prize;

      const leftCell = document.createElement('td');
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.value = String(left[k] || 0);
      input.addEventListener('change', function(){
        // 빈 칸은 0이 아니다. Number('')이 0이고 Number.isInteger(0)이 참이라 setRemaining이
        // 통과해 버리므로, "고치려고 지웠다가 다른 데를 눌렀다"만으로 그 등급이 영구 소진된다.
        // change는 블러 때 발화하므로 이 경로가 실제로 매우 쉽게 밟힌다.
        if (input.value.trim() === ''){
          input.value = String(remaining(state)[k] || 0);
          return;
        }
        const n = Number(input.value);
        try {
          state = setRemaining(state, k, n);
          save();
          refreshKiosk();
          say(GRADES[k].rank + ' 재고를 ' + n + '개로 맞췄습니다');
        } catch (e) {
          input.value = String(remaining(state)[k] || 0);
          say('0 이상의 정수만 넣을 수 있습니다');
        }
      });
      leftCell.appendChild(input);

      const doneCell = document.createElement('td');
      doneCell.textContent = String(done[k] || 0);

      tr.append(name, leftCell, doneCell);
      adminRows.appendChild(tr);
    }
  }

  /**
   * 패널이 열려 있으면 숫자만 제자리에서 갱신한다.
   * 패널은 발권기 바로 아래 같은 화면에 있고 자동으로 닫히지도 않아, 스태프가 열어둔 채
   * 계속 발권하는 것이 자연스러운 동선이다 — 갱신하지 않으면 정산을 옛 숫자 위에서 하게 된다.
   *
   * renderAdmin()을 다시 부르지 않는 이유: 그러면 행을 새로 만들어서 스태프가 입력 중이던
   * 값이 날아간다. 지금 포커스가 있는 칸은 아예 건드리지 않는다.
   */
  function syncAdminNumbers(){
    if (admin.classList.contains('hidden')) return;
    const left = remaining(state);
    const done = tally(state);
    const rows = adminRows.children;
    if (rows.length !== GRADE_KEYS.length) return;   // 아직 그려지기 전이면 아무것도 하지 않는다
    GRADE_KEYS.forEach(function(k, i){
      const row = rows[i];
      const input = row.querySelector('input');
      if (input && input !== document.activeElement) input.value = String(left[k] || 0);
      row.lastElementChild.textContent = String(done[k] || 0);
    });
  }

  document.getElementById('adminClose').addEventListener('click', function(){
    admin.classList.add('hidden');
  });

  document.getElementById('undo').addEventListener('click', function(){
    if (!state.history.length){ say('되돌릴 발권이 없습니다'); return; }
    const last = state.history[state.history.length - 1];
    state = undoLast(state);
    save();
    renderAdmin();
    refreshKiosk();
    say(GRADES[last.grade].rank + ' 1건을 되돌렸습니다');
  });

  // 클립보드는 권한·보안 컨텍스트에 따라 막힌다. 실패하면 텍스트를 화면에 띄워
  // 스태프가 직접 복사할 수 있게 한다 — "복사됐겠거니" 하고 넘어가면 백업이 없다.
  document.getElementById('copyState').addEventListener('click', async function(){
    const text = JSON.stringify(state);
    try {
      await navigator.clipboard.writeText(text);
      say('상태를 복사했습니다');
    } catch {
      window.prompt('아래 내용을 직접 복사해 두세요', text);
    }
  });

  document.getElementById('pasteState').addEventListener('click', function(){
    const raw = window.prompt('복사해 둔 상태를 붙여넣으세요');
    if (raw === null) return;
    const next = restore(raw.trim());
    if (!next){ say('형식이 맞지 않아 반영하지 않았습니다'); return; }
    state = next;
    save();
    renderAdmin();
    refreshKiosk();
    say('상태를 복원했습니다');
  });

  document.getElementById('resetDay').addEventListener('click', function(){
    const n = state.history.length;
    if (!window.confirm('발권 ' + n + '건 기록이 지워지고 재고가 초기화됩니다. 계속할까요?')) return;
    localStorage.removeItem(KEY);
    location.reload();
  });

  // ── 다른 탭 감지 ──
  // 재고는 localStorage에 있지만 state는 탭마다 따로 메모리에 있고 save()는 무조건 덮어쓴다.
  // 탭 A가 300→299를 쓴 뒤 탭 B(메모리엔 아직 300)가 발권하면 다시 299를 쓴다 —
  // 상품은 2개 나가고 차감은 1개다. 화면에도 이력에도 아무 신호가 없다.
  // storage 이벤트는 '다른 탭'의 변경만 오므로 이걸로 잡는다. 조용히 맞추기만 하면 스태프가
  // 두 탭을 계속 쓰게 되므로 반드시 눈에 띄게 알린다.
  window.addEventListener('storage', function(e){
    if (e.key !== KEY) return;
    const next = restore(e.newValue);
    if (!next){
      // 덮어쓰지 않는다 — 이 탭이 들고 있는 재고가 그나마 성한 쪽일 수 있다
      warn('다른 탭이 재고를 지웠거나 알아볼 수 없는 값으로 바꿨습니다. ' +
           '이 탭의 재고는 그대로 두었습니다 — 탭을 하나만 열어 두세요.');
      return;
    }
    const wasSetup = !state;
    state = next;
    // 날짜 선택 화면이었다면 그 화면을 닫는다. 남겨두면 스태프가 날짜를 눌러 다른 탭의
    // 재고까지 초기화해 버린다.
    if (wasSetup) enterKiosk(); else refreshKiosk();
    syncAdminNumbers();
    warn(wasSetup
      ? '다른 탭에서 이미 오늘 재고를 열어 두었습니다. 이 탭을 같은 재고로 맞췄습니다 — 탭을 하나만 열어 두세요.'
      : '다른 탭에서 발권이 있었습니다. 이 탭의 재고를 방금 맞췄습니다 — 탭을 하나만 열어 두세요.');
  });

  if (state) enterKiosk();
</script>

<!-- 오프라인 대비 서비스 워커 등록.
     발권 모듈과 일부러 분리된 블록이다 — 등록이 어떻게 실패하든 위 모듈은 이미 실행을
     끝냈고, 여기서 던진 예외가 발권 동작에 닿지 않는다.
     서비스 워커는 보안 컨텍스트(HTTPS·localhost)에서만 동작한다. 공개본은 gh-pages라
     HTTPS지만, file://이나 평문 http로 열면 등록이 실패한다 — 그때도 페이지는 예전과
     똑같이 돌아야 하므로 기능 감지 + try/catch + .catch()로 세 겹 감싼다. -->
<script>
  if ('serviceWorker' in navigator) {
    // load 이후에 등록한다. 발권 화면이 먼저 뜨고 나서 캐시를 채우게 해 첫 진입을 막지 않는다.
    window.addEventListener('load', function(){
      try {
        // 절대경로(/draw-sw.js)를 쓰면 저장소 이름이 붙는 경로에서 404가 난다. 반드시 상대경로.
        navigator.serviceWorker.register('./draw-sw.js').catch(function(){
          // 등록 실패는 조용히 넘긴다. 캐시가 없을 뿐 발권은 그대로 되고,
          // 여기서 스태프에게 경고를 띄우면 부스에서 아무 조치도 못 할 문구만 남는다.
        });
      } catch (e) { /* 보안 컨텍스트가 아닌 경우 등 — 동기 예외까지 막는다 */ }
    });
  }
</script>

</body>
</html>
