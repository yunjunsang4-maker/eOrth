<title>eOrth 작업 궤도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 앱 디자인 토큰(CLAUDE.md) + 랜딩 페이지 서체. 앱이 다크 전용이라 이 화면도 다크 하나로 고정한다. */
  :root{
    color-scheme:dark;
    --bg:#0A0A0F; --panel:#121219; --card:#2E2E3B; --line:#1A1A26;
    --neon:#BF85FC; --deep:#6B21A8; --dim:#A1A1B0; --faint:#6E6E80; --text:#F3F1F8;
    --red:#FF3B30; --amber:#F2A65A; --cyan:#00D8F3; --pink:#E88BA5; --green:#7BC47F;
    --pill:rgba(255,255,255,.10);
    --display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--body);
       background-image:radial-gradient(70% 40% at 50% -10%,rgba(107,33,168,.30),transparent 70%);background-repeat:no-repeat}
  .wrap{max-width:1480px;margin:0 auto;padding:28px 24px 64px;display:grid;gap:20px}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--neon);outline-offset:2px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* 앱의 대각 흰색 링 테두리(AutoPillRing) */
  .ring{border:1px solid transparent;
        background:linear-gradient(var(--panel),var(--panel)) padding-box,
                   linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.05) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.22)) border-box}

  /* 헤더: 네온 지구본 + 궤도를 도는 위성 하나 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:22px}
  .orb{position:relative;width:46px;height:46px;flex:none;margin-left:8px;border-radius:50%;
       background:radial-gradient(circle at 34% 30%,#F1E4FF 0,#BF85FC 30%,#6B21A8 68%,#1B0B30 100%);
       box-shadow:0 0 22px rgba(191,133,252,.55),inset -6px -8px 14px rgba(10,10,15,.55)}
  .orb::before{content:"";position:absolute;inset:-9px -14px;border-radius:50%;border:1px solid rgba(255,255,255,.28);transform:rotate(-22deg)}
  .orb i{position:absolute;inset:-9px -14px;transform:rotate(-22deg)}
  .orb i::after{content:"";position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px;border-radius:50%;
       background:var(--cyan);box-shadow:0 0 8px var(--cyan);offset-path:ellipse(37px 32px at 37px 32px);animation:orbit 9s linear infinite}
  @keyframes orbit{from{offset-distance:0%}to{offset-distance:100%}}
  .brand img{height:20px;display:block;opacity:.92}
  h1{margin:4px 0 0;font:900 26px/1.1 var(--display);letter-spacing:-.01em}
  .sub{margin:2px 0 0;color:var(--dim);font-size:13px}
  .actions{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px}
  .btn{border:0;cursor:pointer;border-radius:999px;padding:8px 16px;background:var(--neon);color:#16081F;font-weight:600;
       box-shadow:0 0 16px rgba(191,133,252,.40)}
  .btn:hover{background:#D3A8FF}
  .ghost{border:1px solid rgba(255,255,255,.14);background:var(--pill);color:var(--text);border-radius:999px;cursor:pointer;
         padding:4px 11px;font-size:12px;font-weight:500}
  .ghost:hover{border-color:var(--neon);color:#fff}

  /* 요약 줄 */
  .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .tile{border-radius:18px;padding:14px 18px;display:grid;gap:2px;min-width:0}
  .tile b{font:900 30px/1.15 var(--display);font-variant-numeric:tabular-nums}
  .tile span{color:var(--dim);font-size:12px;font-weight:500}
  .tile small{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile.warn b{color:var(--amber)} .tile.alert b{color:var(--neon);text-shadow:0 0 14px rgba(191,133,252,.45)}

  /* 본문 3열 */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1.15fr);gap:16px;align-items:start}
  .col{display:grid;gap:16px;min-width:0}
  .panel{border-radius:22px;padding:18px 18px 20px;display:grid;gap:14px;min-width:0}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h2{margin:0;font:800 17px/1.2 var(--display)}
  h3{margin:0;font:700 12px/1.3 var(--body);color:var(--dim);letter-spacing:.06em}
  .count{color:var(--faint);font-size:12px}
  .empty{color:var(--faint);font-size:13px;margin:0}

  /* 커밋 막대 */
  .chart svg{width:100%;height:auto;display:block}
  .chart text{fill:var(--faint);font:10px var(--mono)}
  .chart text.today{fill:var(--neon)}
  .day{display:grid;gap:6px}
  .day h3{display:flex;gap:8px;font-family:var(--mono);letter-spacing:0;font-weight:500}
  .day h3 em{font-style:normal;color:var(--faint)}
  .commit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
  .commit p{margin:0;min-width:0;overflow-wrap:anywhere}
  .commit .scope{color:var(--dim);font-size:12px;margin-right:6px}
  .commit .hash{color:var(--faint);font-size:11px;margin-left:6px}

  .type{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:7px;background:var(--pill);color:var(--dim);min-width:44px;text-align:center}
  .t-feat{color:var(--neon);background:rgba(191,133,252,.14)} .t-fix{color:var(--cyan);background:rgba(0,216,243,.11)}
  .t-perf{color:var(--amber);background:rgba(242,166,90,.12)} .t-style{color:var(--pink);background:rgba(232,139,165,.12)}
  .t-refactor{color:var(--green);background:rgba(123,196,127,.12)}

  /* 진행 중 */
  .branchline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;background:var(--pill);font-size:12px;color:var(--dim);white-space:nowrap}
  .chip.on{color:var(--text)}
  .group{display:grid;gap:4px}
  .group h3{font-family:var(--mono);letter-spacing:0;font-weight:500;overflow-wrap:anywhere}
  .file{display:flex;gap:8px;align-items:baseline;font-size:13px;min-width:0}
  .file span:last-child{overflow-wrap:anywhere;min-width:0}
  .st{font:500 10px/1 var(--mono);padding:3px 5px;border-radius:5px;flex:none}
  .st-M{color:var(--amber);background:rgba(242,166,90,.12)} .st-N{color:var(--neon);background:rgba(191,133,252,.14)}
  .st-D{color:var(--red);background:rgba(255,59,48,.12)} .st-A{color:var(--cyan);background:rgba(0,216,243,.11)}
  .branches{display:grid;gap:4px;font-size:13px}
  .branches div{display:flex;justify-content:space-between;gap:12px}
  .branches span:first-child{overflow-wrap:anywhere;min-width:0}
  .branches span:last-child{color:var(--faint);flex:none}
  .rel{display:grid;gap:3px;padding-top:10px;border-top:1px solid var(--line)}
  .rel b{font-weight:600;font-size:13px}
  .rel p{margin:0;color:var(--dim);font-size:13px}

  /* 할 일 */
  .plan{display:grid;gap:6px}
  .task{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.035)}
  .task input{appearance:none;flex:none;width:18px;height:18px;margin:2px 0 0;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);cursor:pointer;display:grid;place-items:center}
  .task input:checked{background:var(--neon);border-color:var(--neon)}
  .task input:checked::after{content:"";width:8px;height:4px;border:2px solid #16081F;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
  .task input:disabled{cursor:default}
  .task label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
  .task.done label{color:var(--faint);text-decoration:line-through}
  .task .chip{font-size:11px;padding:2px 8px}
  .add{display:flex;gap:8px}
  .add input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 14px}
  .add input::placeholder{color:var(--faint)}
  .note{margin:0;color:var(--faint);font-size:12px}

  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .filters button{border:1px solid transparent;cursor:pointer}
  .filters button[aria-pressed="true"]{border-color:var(--neon);color:#fff;background:rgba(191,133,252,.16)}
  .found{display:grid;gap:8px}
  .item{display:grid;gap:6px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.035);border-left:3px solid var(--sev,var(--faint))}
  .item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .item .meta .mono{color:var(--faint);font-size:11px;margin-right:2px}
  .item p{margin:0;font-size:13px;color:var(--text);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .item p.open{-webkit-line-clamp:unset}
  .item .btns{display:flex;gap:6px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
         background:var(--card);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5)}

  @media (max-width:1180px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.col-todo{grid-column:1/-1;order:-1}}
  @media (max-width:720px){
    .wrap{padding:18px 16px 48px}
    .grid{grid-template-columns:minmax(0,1fr)}
    .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
    .commit .hash{display:none}
  }
  @media (prefers-reduced-motion:reduce){.orb i::after{animation:none;offset-distance:20%}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="orb" aria-hidden="true"><i></i></span>
      <div>
        <img src="__LOGO__" alt="eOrth">
        <h1>작업 궤도</h1>
        <p class="sub" id="sub"></p>
      </div>
    </div>
    <div class="actions"><span id="stamp" class="mono"></span><button class="btn" id="refresh" type="button">새로고침</button></div>
  </header>

  <section class="strip" id="strip" aria-label="요약"></section>

  <main class="grid">
    <div class="col">
      <section class="panel ring" id="done"></section>
    </div>
    <div class="col">
      <section class="panel ring" id="now"></section>
      <section class="panel ring" id="release"></section>
    </div>
    <div class="col col-todo">
      <section class="panel ring" id="plan"></section>
      <section class="panel ring" id="found"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const TAG_COLOR = {'서버 반영':'var(--red)','새 빌드':'var(--neon)','미커밋':'var(--amber)','미병합':'var(--amber)',
  'OTA 미발행':'var(--cyan)','실기기 검증':'var(--cyan)','추후·보류':'var(--faint)','남은 일':'var(--dim)'};
const RELEASE_NAME = {'eorth-testflight-build-log':'iOS 빌드·제출','eorth-play-store-launch':'Google Play 출시',
  'eorth-launch-checklist':'정식 출시 체크리스트','eorth-admob-application-rejected':'AdMob 신청'};

function mk(ns, tag, attrs, kids) {
  const el = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k);
  return el;
}
const h = (tag, attrs, ...kids) => mk(null, tag, attrs, kids);
const s = (tag, attrs, ...kids) => mk('http://www.w3.org/2000/svg', tag, attrs, kids);
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const label = (v) => { const d = new Date(v + 'T00:00'); return `${v.slice(5).replace('-', '.')} ${WEEK[d.getDay()]}`; };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}
function stash(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function unstash(k) { try { const v = sessionStorage.getItem(k); sessionStorage.removeItem(k); return v; } catch (e) { return null; } }
async function post(body, done) {
  try {
    const r = await fetch('/api/plan', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `저장하지 못했습니다(${r.status}).`);
    stash('toast', done);
    location.reload();
  } catch (e) { toast(e.message); }
}

// ── 파생 값 ──
const today = ymd(new Date());
const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 13 + i); return ymd(d); });
const perDay = Object.fromEntries(days.map((d) => [d, 0]));
for (const c of DATA.commits) { const d = c.d.slice(0, 10); if (d in perDay) perDay[d]++; }
const week = days.slice(7).reduce((n, d) => n + perDay[d], 0);
const planItems = DATA.plan.flatMap((x) => x.items);
const openPlan = planItems.filter((i) => !i.done).length;
const tagCount = {};
for (const f of DATA.found) for (const t of f.tags) tagCount[t] = (tagCount[t] || 0) + 1;
const topTag = DATA.tagOrder.filter((t) => tagCount[t]).sort((a, b) => tagCount[b] - tagCount[a])[0];

// ── 헤더·요약 ──
$('sub').textContent = `${DATA.branch || '브랜치 없음'} · 한 일, 진행 중인 일, 할 일`;
$('stamp').textContent = DATA.live ? `${DATA.generatedAt.slice(11)} 기준` : `스냅샷 ${DATA.generatedAt}`;
if (DATA.live) $('refresh').onclick = () => location.reload();
else $('refresh').hidden = true;

const ins = DATA.shortstat.match(/(\d+) insertion/), del = DATA.shortstat.match(/(\d+) deletion/);
$('strip').append(
  h('div', {class: 'tile ring'}, h('span', {}, '지난 7일 커밋'), h('b', {}, String(week)), h('small', {}, `14일 동안 ${DATA.commits.length}개`)),
  h('div', {class: `tile ring${DATA.status.length ? ' warn' : ''}`}, h('span', {}, '커밋 안 한 파일'), h('b', {}, String(DATA.status.length)),
    h('small', {class: 'mono'}, DATA.status.length ? `+${ins ? ins[1] : 0} −${del ? del[1] : 0}줄` : '작업트리 깨끗함')),
  h('div', {class: 'tile ring'}, h('span', {}, '남은 계획'), h('b', {}, String(openPlan)), h('small', {}, `전체 ${planItems.length}개 중`)),
  h('div', {class: `tile ring${DATA.found.length ? ' alert' : ''}`}, h('span', {}, '확인 필요'), h('b', {}, String(DATA.found.length)),
    h('small', {}, topTag ? `${topTag} ${tagCount[topTag]}건이 가장 많음` : '메모리에 남은 표시 없음')),
);

// ── 한 일 ──
function chart() {
  const max = Math.max(1, ...Object.values(perDay)), W = 22, H = 56, top = 14, base = top + H;
  const svg = s('svg', {viewBox: `0 0 ${days.length * W} ${base + 16}`, role: 'img', 'aria-label': '최근 14일 날짜별 커밋 수'},
    s('line', {x1: 0, x2: days.length * W, y1: top, y2: top, stroke: 'rgba(255,255,255,.08)', 'stroke-dasharray': '2 3'}),
    s('text', {x: 0, y: top - 4}, `최대 ${max}`),
    s('line', {x1: 0, x2: days.length * W, y1: base, y2: base, stroke: 'rgba(255,255,255,.12)'}));
  days.forEach((d, i) => {
    const n = perDay[d], x = i * W + 5, isT = d === today;
    if (n) {
      const bh = Math.max(3, (n / max) * H);
      svg.append(s('rect', {x, y: base - bh, width: 12, height: bh, rx: 3, fill: isT ? '#BF85FC' : 'rgba(191,133,252,.42)',
        style: isT ? 'filter:drop-shadow(0 0 5px #BF85FC)' : null}, s('title', {}, `${label(d)} · ${n}개`)));
    } else {
      svg.append(s('circle', {cx: x + 6, cy: base - 3, r: 1.6, fill: 'rgba(255,255,255,.22)'}));
    }
    svg.append(s('text', {x: x + 6, y: base + 13, 'text-anchor': 'middle', class: isT ? 'today' : null}, String(Number(d.slice(8)))));
  });
  return h('div', {class: 'chart'}, svg);
}
const byDay = {};
for (const c of DATA.commits) (byDay[c.d.slice(0, 10)] ||= []).push(c);
$('done').append(
  h('div', {class: 'head'}, h('h2', {}, '한 일'), h('span', {class: 'count mono'}, `최근 14일 · ${DATA.commits.length}커밋`)),
  chart(),
  ...(DATA.commits.length ? Object.keys(byDay).map((d) => h('div', {class: 'day'},
    h('h3', {}, label(d), d === today ? h('em', {}, '오늘') : null, h('em', {}, `${byDay[d].length}개`)),
    ...byDay[d].map((c) => h('div', {class: 'commit'},
      h('span', {class: `type t-${c.type}`}, c.type || '기타'),
      h('p', {}, c.scope ? h('span', {class: 'scope mono'}, c.scope) : null, c.subj, h('span', {class: 'hash mono'}, c.h))))))
    : [h('p', {class: 'empty'}, '최근 14일 동안 커밋이 없습니다.')]),
);

// ── 진행 중 ──
const STATUS = {M: ['M', '수정'], '??': ['N', '새 파일'], D: ['D', '삭제'], A: ['A', '추가'], R: ['M', '이름 변경']};
const groups = {};
for (const f of DATA.status) {
  const parts = f.p.replace(/\/$/, '').split('/');
  const dir = parts.length > 1 ? parts.slice(0, Math.min(3, parts.length - 1)).join('/') : '(루트)';
  (groups[dir] ||= []).push(f);
}
$('now').append(
  h('div', {class: 'head'}, h('h2', {}, '진행 중'), h('span', {class: 'count mono'}, `${DATA.status.length}개 파일`)),
  h('div', {class: 'branchline'},
    h('span', {class: 'chip on mono'}, DATA.branch || '-'),
    DATA.ahead ? h('span', {class: 'chip', style: 'color:var(--amber)'}, `푸시 안 한 커밋 ${DATA.ahead}개`)
      : DATA.ahead === 0 ? h('span', {class: 'chip'}, '원격과 같음') : null),
  ...(DATA.status.length ? Object.entries(groups).map(([dir, files]) => h('div', {class: 'group'},
    h('h3', {}, dir),
    ...files.map((f) => {
      const [cls, txt] = STATUS[f.c] || ['M', f.c];
      return h('div', {class: 'file'}, h('span', {class: `st st-${cls}`, title: txt}, txt),
        h('span', {}, dir === '(루트)' ? f.p : f.p.slice(dir.length + 1) || f.p));
    })))
    : [h('p', {class: 'empty'}, '커밋 안 한 변경이 없습니다.')]),
  DATA.branches.length ? h('div', {class: 'group'}, h('h3', {}, `병합 안 된 브랜치 ${DATA.branches.length}개`),
    h('div', {class: 'branches'},
      ...DATA.branches.slice(0, 8).map((b) => h('div', {}, h('span', {class: 'mono'}, b.n), h('span', {class: 'mono'}, b.d.slice(5).replace('-', '.')))),
      DATA.branches.length > 8 ? h('span', {class: 'note'}, `외 ${DATA.branches.length - 8}개`) : null)) : null,
);

$('release').append(
  h('div', {class: 'head'}, h('h2', {}, '출시 상태'), h('span', {class: 'count'}, '메모리 기준')),
  ...(DATA.release.length ? DATA.release.map((r) => h('div', {class: 'rel'}, h('b', {}, RELEASE_NAME[r.slug] || r.slug), h('p', {}, r.desc)))
    : [h('p', {class: 'empty'}, '출시 관련 메모리를 찾지 못했습니다.')]),
);

// ── 할 일: 내 계획 ──
const planBox = h('div', {class: 'plan'});
for (const sec of DATA.plan) {
  if (sec.title) planBox.append(h('h3', {style: 'margin-top:6px'}, sec.title));
  for (const it of sec.items) {
    const id = `task-${it.i}`;
    planBox.append(h('div', {class: `task${it.done ? ' done' : ''}`},
      h('input', {type: 'checkbox', id, checked: it.done, disabled: !DATA.live,
        onchange: () => post({op: 'toggle', i: it.i}, it.done ? '다시 할 일로 돌렸습니다' : '완료로 표시했습니다')}),
      h('label', {for: id}, it.text),
      it.ref ? h('span', {class: 'chip', title: it.ref}, '메모리') : null));
  }
}
if (!planItems.length) planBox.append(h('p', {class: 'empty'}, '아직 계획이 없습니다. 아래에 적거나 자동 발견에서 추가하세요.'));
$('plan').append(
  h('div', {class: 'head'}, h('h2', {}, '내 계획'), h('span', {class: 'count mono'}, `${openPlan}개 남음`)),
  planBox,
  DATA.live
    ? h('form', {class: 'add', onsubmit: (e) => { e.preventDefault(); const v = $('newTask').value.trim(); if (v) post({op: 'add', text: v}, '계획에 추가했습니다'); }},
        h('input', {id: 'newTask', placeholder: '할 일 적기 (예: 안드로이드 실기기에서 지도 확대 확인)', autocomplete: 'off'}),
        h('button', {class: 'btn', type: 'submit'}, '추가'))
    : h('p', {class: 'note'}, '휴대폰에서는 보기만 됩니다. 체크와 추가는 노트북의 작업 궤도에서 하세요.'),
  DATA.live ? h('p', {class: 'note'}, 'tools/dashboard/PLAN.md에 저장됩니다. 파일을 직접 고쳐도 됩니다.') : null,
);

// ── 할 일: 자동 발견 ──
let filter = null;
try { filter = localStorage.getItem('eorth-dash-filter'); } catch (e) {}
if (filter && !tagCount[filter]) filter = null;
const foundList = h('div', {class: 'found'});
const filters = h('div', {class: 'filters', role: 'group', 'aria-label': '표시로 거르기'});
function planText(f) {
  let t = f.desc.split(' — ')[0].replace(/\s*\([^()]*\)\s*$/, '').trim();
  if (t.length > 80) t = t.slice(0, 79) + '…';
  return `${f.tags[0]}: ${t}`;
}
function setFilter(t) {
  filter = t;
  try { t ? localStorage.setItem('eorth-dash-filter', t) : localStorage.removeItem('eorth-dash-filter'); } catch (e) {}
  renderFound();
}
function renderFound() {
  filters.replaceChildren(...[null, ...DATA.tagOrder.filter((t) => tagCount[t])].map((t) =>
    h('button', {type: 'button', class: 'chip', 'aria-pressed': String(filter === t), onclick: () => setFilter(t)},
      t ? h('span', {class: 'dot', style: `--c:${TAG_COLOR[t]}`}) : null,
      t || '전체', h('span', {class: 'mono'}, String(t ? tagCount[t] : DATA.found.length)))));
  const list = DATA.found.filter((f) => !filter || f.tags.includes(filter));
  foundList.replaceChildren(...(list.length ? list.map((f) => h('article', {class: 'item', style: `--sev:${TAG_COLOR[f.tags[0]]}`},
    h('div', {class: 'meta'}, h('span', {class: 'mono'}, f.date.slice(2).replaceAll('-', '.')),
      ...f.tags.map((t) => h('span', {class: 'tag', style: `--c:${TAG_COLOR[t]}`}, t))),
    h('p', {title: '눌러서 전체 보기', onclick: (e) => e.currentTarget.classList.toggle('open')}, f.desc),
    DATA.live ? h('div', {class: 'btns'},
      h('button', {type: 'button', class: 'ghost', onclick: () => post({op: 'add', text: planText(f), ref: f.slug}, '계획에 추가했습니다')}, '계획에 추가'),
      h('button', {type: 'button', class: 'ghost', onclick: () => post({op: 'hide', ref: f.slug}, '숨겼습니다. tools/dashboard/hidden.txt에서 되돌릴 수 있습니다')}, '숨기기')) : null))
    : [h('p', {class: 'empty'}, DATA.memoryFound ? '메모리에 남은 일 표시가 없습니다.' : 'Claude 메모리 폴더를 찾지 못했습니다.')]));
}
renderFound();
$('found').append(
  h('div', {class: 'head'}, h('h2', {}, '자동 발견'), h('span', {class: 'count'}, '메모리에서 찾은 남은 일')),
  filters, foundList,
);

const pending = unstash('toast');
if (pending) toast(pending);
</script>
