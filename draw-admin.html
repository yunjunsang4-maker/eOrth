<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>eOrth 부스 뽑기 — 관리</title>
<style>
  :root{
    --bg:#0A0A0F;
    --ink:#F5F3FA;
    --dim:#A1A1B0;
    --line:#1A1A26;
    --card:#2E2E3B;
    --neon:#BF85FC;
    --deep:#6B21A8;
    --red:#FF3B30;
    --ok:#4ADE80;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:880px;margin:0 auto;padding:32px 20px 80px;display:flex;flex-direction:column;gap:24px}

  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  h2{font-size:14px;margin:0 0 12px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:13px;margin:0}

  .head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .conn{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
        letter-spacing:.1em;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:#3A3644;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px rgba(74,222,128,.7)}
  .dot.off{background:var(--red);box-shadow:0 0 8px rgba(255,59,48,.7)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}

  /* 토큰 입력 */
  .gate{display:flex;flex-direction:column;gap:14px;max-width:360px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld span{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
  input[type=password],input[type=text],input[type=number]{
    background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-family:var(--mono);font-size:15px
  }
  input:focus-visible{outline:2px solid var(--neon);outline-offset:1px}

  button{font-family:var(--sans);cursor:pointer}
  .btn{
    background:var(--neon);color:#16081F;border:0;border-radius:10px;
    padding:12px 16px;font-size:15px;font-weight:800
  }
  .btn:hover:not(:disabled){filter:brightness(1.07)}
  .btn:disabled{opacity:.45;cursor:default}
  .ghost{
    background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;font-size:13px
  }
  .ghost:hover:not(:disabled){border-color:var(--neon);color:var(--neon)}
  .ghost:disabled{opacity:.4;cursor:default}
  .ghost.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
  button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* 재고 표 */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);text-align:left;font-weight:500;padding-bottom:8px
  }
  td{padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  th.n,td.n{text-align:right;width:88px}
  td input{width:74px;padding:6px 8px;font-size:14px;text-align:right}
  .grade-name{font-weight:600}
  .grade-prize{color:var(--dim);font-size:12px}
  .gold{color:#FFD9A0}

  .totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
  .tot{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
  .tot dt{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .tot dd{margin:4px 0 0;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

  /* 기기 예약 */
  .devs{display:flex;flex-direction:column;gap:8px}
  .dev{display:flex;align-items:center;justify-content:space-between;gap:12px;
       background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .dev b{font-family:var(--mono);font-size:13px;letter-spacing:.06em}
  .dev span{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

  /* 최근 로그 */
  .log{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto}
  .log-row{display:grid;grid-template-columns:64px 1fr auto auto;gap:10px;align-items:center;
           padding:6px 0;border-top:1px solid var(--line);font-size:13px}
  .log-row:first-child{border-top:0}
  .log-t{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .log-src{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .log-row.undone{opacity:.42;text-decoration:line-through}

  .msg{margin:12px 0 0;font-size:13px;color:var(--neon);min-height:19px}
  .alert{
    margin:0;background:var(--card);border:1px solid var(--neon);border-left:4px solid var(--neon);
    border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5;cursor:pointer
  }
  .hidden{display:none}
  .empty{color:var(--dim);font-size:13px;margin:0}
</style>
</head>
<body>

<div class="page">

  <p class="alert hidden" id="alert" role="alert"></p>

  <div class="head">
    <div>
      <h1>부스 뽑기 관리</h1>
      <p class="sub" id="dayLine">노트북 전용 화면입니다. 아이패드에는 이 기능이 없습니다.</p>
    </div>
    <div class="conn"><i class="dot" id="dot"></i><span id="connText">대기</span></div>
  </div>

  <!-- 토큰 입력 -->
  <section class="card" id="gate">
    <h2>관리 토큰</h2>
    <form class="gate" id="gateForm">
      <label class="fld">
        <span>Admin token</span>
        <input type="password" id="tokenInput" autocomplete="off" required
               autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <button class="btn" type="submit">열기</button>
      <p class="msg" id="gateMsg"></p>
    </form>
  </section>

  <!-- 콘솔 -->
  <div id="console" class="hidden" style="display:flex;flex-direction:column;gap:24px">

    <section class="card">
      <h2>행사 날짜</h2>
      <p class="sub" id="openHint">날짜를 열어야 아이패드가 발권을 시작합니다.</p>
      <div class="row" style="margin-top:12px" id="dayRow"></div>
      <p class="msg" id="dayMsg"></p>
    </section>

    <section class="card">
      <h2>재고</h2>
      <table>
        <thead>
          <tr><th>등급</th><th class="n">남음</th><th class="n">발권</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <dl class="totals" id="totals"></dl>
      <div class="row" style="margin-top:16px">
        <button class="ghost danger" id="undoBtn">마지막 1건 되돌리기</button>
        <button class="ghost" id="refreshBtn">지금 새로고침</button>
      </div>
      <p class="msg" id="stockMsg"></p>
    </section>

    <section class="card">
      <h2>기기별 예약 재고</h2>
      <p class="sub">와이파이가 끊겼을 때 쓰라고 아이패드가 미리 받아 둔 몫입니다.
        아래 수량은 위 "남음"에서 이미 빠져 있습니다.</p>
      <div class="devs" style="margin-top:12px" id="devs"></div>
    </section>

    <section class="card">
      <h2>최근 발권 20건</h2>
      <div class="log" id="log"></div>
    </section>

  </div>
</div>

<script type="module">
  import { GRADES, GRADE_KEYS, DAY_POOLS, EVENT_DAYS, LEASE_KEYS } from './draw-core.js';

  // draw.html과 같은 운영 프로젝트·같은 anon 키다. 이 키만으로는 아무것도 못 한다 —
  // 뽑기 테이블은 권한이 전부 회수돼 있고, RPC가 아래 관리 토큰을 따로 검사한다.
  const SUPABASE_URL = 'https://blweolnunmsxgztmvzfd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsd2VvbG51bm1zeGd6dG12emZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDg4MDgsImV4cCI6MjA5NjY4NDgwOH0.PQeY2ShGmCAxiwDEOQSOcgIVsSkJ_PyeG1VE8uI5fc8';

  const K_TOKEN = 'eorth_draw_admin_token';

  const $ = (id) => document.getElementById(id);
  const alertBox = $('alert');
  function warn(msg){
    alertBox.textContent = msg;
    alertBox.classList.remove('hidden');
  }
  alertBox.addEventListener('click', function(){ alertBox.classList.add('hidden'); });

  function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch { /* 프라이빗 모드 */ } }

  let token = lsGet(K_TOKEN) || '';
  let state = null;

  async function rpc(fn, args, ms){
    const ctl = new AbortController();
    const timer = setTimeout(function(){ ctl.abort(); }, ms || 8000);
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(args),
        signal: ctl.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  function setConn(ok){
    $('dot').classList.toggle('on', ok === true);
    $('dot').classList.toggle('off', ok === false);
    $('connText').textContent = ok === true ? '연결됨' : ok === false ? '연결 끊김' : '대기';
  }

  function say(el, msg){
    el.textContent = msg;
    setTimeout(function(){ if (el.textContent === msg) el.textContent = ''; }, 3000);
  }

  // ── 날짜 버튼 ──
  // 수량은 draw-core.js의 DAY_POOLS에서 읽어 서버로 보낸다. SQL에 수량을 또 적어두면
  // 두 벌이 되어 한쪽만 고쳤을 때 조용히 어긋난다.
  function renderDays(){
    const row = $('dayRow');
    row.replaceChildren();
    for (const day of Object.keys(DAY_POOLS)){
      const pool = DAY_POOLS[day];
      const sum = GRADE_KEYS.reduce(function(n, k){ return n + (pool[k] || 0); }, 0);
      const b = document.createElement('button');
      b.className = state && state.day === day ? 'btn' : 'ghost';
      b.textContent = EVENT_DAYS[day].label + ' 열기 (' + sum + '개'
                    + (pool.g1 > 0 ? ' · 항공권 포함' : '') + ')';
      b.disabled = !!(state && state.day === day && state.open);
      b.addEventListener('click', function(){ openDay(day); });
      row.appendChild(b);
    }
    const close = document.createElement('button');
    close.className = 'ghost danger';
    close.textContent = '발권 닫기';
    close.disabled = !(state && state.open);
    close.addEventListener('click', closeDay);
    row.appendChild(close);
  }

  async function openDay(day){
    if (!window.confirm(EVENT_DAYS[day].label + ' 재고를 엽니다. 아이패드가 즉시 발권을 시작합니다. 계속할까요?')) return;
    try {
      const r = await rpc('draw_admin_open',
        { p_token: token, p_day: day, p_pool: DAY_POOLS[day] });
      if (!r || !r.ok){ say($('dayMsg'), '열지 못했습니다: ' + (r && r.error)); return; }
      say($('dayMsg'), EVENT_DAYS[day].label + ' 재고를 열었습니다');
      await load();
    } catch { say($('dayMsg'), '서버에 연결하지 못했습니다'); }
  }

  async function closeDay(){
    if (!window.confirm('발권을 닫습니다. 아이패드가 "준비 중"으로 바뀌고 더 이상 발권되지 않습니다. 계속할까요?')) return;
    try {
      const r = await rpc('draw_admin_close', { p_token: token });
      if (!r || !r.ok){ say($('dayMsg'), '닫지 못했습니다: ' + (r && r.error)); return; }
      say($('dayMsg'), '발권을 닫았습니다');
      await load();
    } catch { say($('dayMsg'), '서버에 연결하지 못했습니다'); }
  }

  // ── 재고 표 ──
  function renderStock(){
    const rows = $('rows');
    const rem = state.remaining || {};
    const tally = state.tally || {};
    rows.replaceChildren();

    for (const k of GRADE_KEYS){
      const g = GRADES[k];
      const tr = document.createElement('tr');

      const name = document.createElement('td');
      const b = document.createElement('div');
      b.className = 'grade-name' + (g.gold ? ' gold' : '');
      b.textContent = g.rank;
      const p = document.createElement('div');
      p.className = 'grade-prize';
      p.textContent = g.prize;
      name.append(b, p);

      const left = document.createElement('td');
      left.className = 'n';
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.value = String(rem[k] || 0);
      input.dataset.grade = k;
      input.addEventListener('change', function(){
        // 빈 칸은 0이 아니다. Number('')이 0이라 그대로 통과하면
        // "고치려고 지웠다가 다른 데를 눌렀다"만으로 그 등급이 영구 소진된다.
        if (input.value.trim() === ''){ input.value = String((state.remaining || {})[k] || 0); return; }
        setStock(k, Number(input.value));
      });
      left.appendChild(input);

      const done = document.createElement('td');
      done.className = 'n';
      done.textContent = String(tally[k] || 0);

      tr.append(name, left, done);
      rows.appendChild(tr);
    }

    // 합계
    const totalLeft = GRADE_KEYS.reduce(function(n, k){ return n + (rem[k] || 0); }, 0);
    const totalDone = GRADE_KEYS.reduce(function(n, k){ return n + (tally[k] || 0); }, 0);
    let totalHold = 0;
    for (const d of Object.keys(state.holds || {})){
      totalHold += LEASE_KEYS.reduce(function(n, k){ return n + (state.holds[d][k] || 0); }, 0);
    }
    const totals = $('totals');
    totals.replaceChildren();
    for (const [label, val] of [['남은 재고', totalLeft], ['오늘 발권', totalDone], ['예약 중', totalHold]]){
      const wrap = document.createElement('div');
      wrap.className = 'tot';
      const dt = document.createElement('dt'); dt.textContent = label;
      const dd = document.createElement('dd'); dd.textContent = String(val);
      wrap.append(dt, dd);
      totals.appendChild(wrap);
    }
  }

  async function setStock(grade, n){
    if (!Number.isInteger(n) || n < 0){ say($('stockMsg'), '0 이상의 정수만 넣을 수 있습니다'); await load(); return; }
    try {
      const r = await rpc('draw_admin_set', { p_token: token, p_grade: grade, p_n: n });
      if (!r || !r.ok){ say($('stockMsg'), '반영하지 못했습니다: ' + (r && r.error)); await load(); return; }
      say($('stockMsg'), GRADES[grade].rank + ' 재고를 ' + n + '개로 맞췄습니다');
      await load();
    } catch { say($('stockMsg'), '서버에 연결하지 못했습니다'); }
  }

  $('undoBtn').addEventListener('click', async function(){
    if (!window.confirm('마지막 1건을 되돌립니다. 그 등급의 재고가 1개 돌아옵니다. 계속할까요?')) return;
    try {
      const r = await rpc('draw_admin_undo', { p_token: token });
      if (!r || !r.ok){
        say($('stockMsg'), r && r.error === 'nothing' ? '되돌릴 발권이 없습니다' : '되돌리지 못했습니다');
        return;
      }
      say($('stockMsg'), (GRADES[r.grade] ? GRADES[r.grade].rank : r.grade) + ' 1건을 되돌렸습니다');
      await load();
    } catch { say($('stockMsg'), '서버에 연결하지 못했습니다'); }
  });

  $('refreshBtn').addEventListener('click', function(){ load(); });

  // ── 기기별 예약 ──
  function renderDevs(){
    const devs = $('devs');
    devs.replaceChildren();
    const holds = state.holds || {};
    const names = Object.keys(holds);
    if (!names.length){
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '아직 예약을 받아 간 기기가 없습니다.';
      devs.appendChild(p);
      return;
    }
    for (const name of names.sort()){
      const h = holds[name] || {};
      const n = LEASE_KEYS.reduce(function(a, k){ return a + (h[k] || 0); }, 0);
      const parts = LEASE_KEYS
        .filter(function(k){ return h[k]; })
        .map(function(k){ return GRADES[k].rank + ' ' + h[k]; });
      const row = document.createElement('div');
      row.className = 'dev';
      const b = document.createElement('b'); b.textContent = name;
      const s = document.createElement('span');
      s.textContent = n + '장' + (parts.length ? ' — ' + parts.join(', ') : '');
      row.append(b, s);
      devs.appendChild(row);
    }
  }

  // ── 최근 로그 ──
  function renderLog(){
    const log = $('log');
    log.replaceChildren();
    const recent = state.recent || [];
    if (!recent.length){
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '아직 발권 기록이 없습니다.';
      log.appendChild(p);
      return;
    }
    for (const r of recent){
      const row = document.createElement('div');
      row.className = 'log-row' + (r.undone ? ' undone' : '');
      const t = document.createElement('span');
      t.className = 'log-t';
      t.textContent = new Date(r.at).toLocaleTimeString('ko-KR', { hour12: false });
      const g = document.createElement('span');
      const gr = GRADES[r.grade];
      g.textContent = gr ? gr.rank + ' · ' + gr.prize : r.grade;
      if (gr && gr.gold) g.className = 'gold';
      const d = document.createElement('span');
      d.className = 'log-src';
      d.textContent = r.device;
      const s = document.createElement('span');
      s.className = 'log-src';
      // 'lease' = 와이파이가 끊긴 동안 아이패드가 예약분으로 발권한 것
      s.textContent = r.source === 'lease' ? '오프라인' : '온라인';
      row.append(t, g, d, s);
      log.appendChild(row);
    }
  }

  // ── 불러오기 ──
  let loading = false;
  async function load(){
    if (loading) return;
    loading = true;
    try {
      const r = await rpc('draw_admin_state', { p_token: token });
      setConn(true);
      if (!r || !r.ok){
        if (r && r.error === 'auth'){
          warn('관리 토큰이 거부됐습니다. 서버의 draw_config를 확인하세요.');
          gateOut();
        }
        return;
      }
      state = r;
      $('dayLine').textContent = r.open
        ? (EVENT_DAYS[r.day] ? EVENT_DAYS[r.day].label : r.day) + ' 발권 중'
        : '발권이 닫혀 있습니다 — 아이패드는 "준비 중"으로 보입니다.';
      renderDays();
      renderStock();
      renderDevs();
      renderLog();
    } catch {
      setConn(false);
    } finally {
      loading = false;
    }
  }

  // ── 토큰 게이트 ──
  function gateIn(){
    $('gate').classList.add('hidden');
    $('console').classList.remove('hidden');
    load();
  }
  function gateOut(){
    token = '';
    lsSet(K_TOKEN, '');
    $('console').classList.add('hidden');
    $('gate').classList.remove('hidden');
  }

  $('gateForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const t = $('tokenInput').value.trim();
    if (t.length < 8){ $('gateMsg').textContent = '토큰이 너무 짧습니다.'; return; }
    $('gateMsg').textContent = '확인 중…';
    try {
      const r = await rpc('draw_admin_state', { p_token: t });
      if (!r || !r.ok){
        $('gateMsg').textContent = r && r.error === 'auth'
          ? '관리 토큰이 맞지 않습니다.' : '서버가 거부했습니다.';
        return;
      }
      token = t;
      lsSet(K_TOKEN, t);
      $('gateMsg').textContent = '';
      $('tokenInput').value = '';
      gateIn();
    } catch {
      $('gateMsg').textContent = '서버에 연결하지 못했습니다.';
    }
  });

  // 입력 중인 칸은 건드리지 않는다 — 폴링이 스태프가 타이핑하던 값을 덮으면
  // 재고를 고치는 도중에 숫자가 되돌아가 버린다.
  setInterval(function(){
    if (!token) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    load();
  }, 3000);

  if (token) gateIn();
</script>

</body>
</html>
